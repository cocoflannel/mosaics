<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  *, *::before, *::after {
    box-sizing: border-box;
  }

  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    font-size: 12.5px;
    line-height: 20px;
    color: #222;
    background: transparent;
  }

  .ico {
    display: inline-block;
    font-size: 12px;
    line-height: 1;
    vertical-align: -1px;
  }

  .header {
    height: 30px;
    font-size: 17px;
    line-height: 24px;
    padding-bottom: 6px;
    font-weight: 700;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .header .ico {
    font-size: 16px;
    vertical-align: -2px;
  }

  .columns {
    display: grid;
    grid-template-columns: minmax(159px, 1fr) minmax(0, 1fr);
    width: 100%;
    max-height: 270px;
    overflow: hidden;
  }

  .col-left {
    padding-right: 8px;
    border-right: 1px solid #ccc;
    min-width: 0;
    overflow-wrap: break-word;
  }

  .col-right {
    padding-left: 8px;
    min-width: 0;
    overflow-wrap: break-word;
  }

  .meta-block {
    max-height: 100px;
    overflow: hidden;
  }

  .photo {
    display: block;
    width: 150px;
    height: 150px;
    object-fit: cover;
    margin: 0;
  }
</style>
</head>
<body>
  <div class="header"><span class="ico">🏷️</span> Nr: <span id="nr"></span></div>

  <div class="columns">
    <div class="col-left">
      <div class="meta-block">
        <div><span class="ico">ℹ️</span> <strong>Opis:</strong> <span id="opis"></span></div>
        <div><span class="ico">📌</span> <strong>Adres:</strong> <span id="adres"></span></div>
      </div>
      <div><span class="ico">📸</span> <strong>Zdjęcie:</strong></div>
      <img id="zdjecie" class="photo" src="" alt="Zdjęcie">
    </div>

    <div class="col-right">
      <div><span class="ico">📖</span> <strong>Nazwa:</strong> <span id="nazwa"></span></div>
      <div><span class="ico">👤</span> <strong>Autor:</strong> <span id="autor"></span></div>
      <div><span class="ico">🗓️</span> <strong>Rok:</strong> <span id="rok"></span></div>
    </div>
  </div>

<script>
  const params = new URLSearchParams(window.location.search);
  const get = (key) => params.get(key) || '';

  const nr = get('nr');
  document.getElementById('nr').textContent = nr;
  document.getElementById('opis').textContent = get('opis');
  document.getElementById('adres').textContent = get('adres');
  document.getElementById('nazwa').textContent = get('tytul') || get('nazwa');
  document.getElementById('autor').textContent = get('autor');
  document.getElementById('rok').textContent = get('rok');

  const img = document.getElementById('zdjecie');
  const baseUrl = 'https://cocoflannel.github.io/mosaics/thumbnails/';

  if (nr) {
    img.src = `${baseUrl}${encodeURIComponent(nr)}.jpg`;
  } else {
    img.src = `${baseUrl}default.jpg`;
  }
  
</script>
</body>
</html>
